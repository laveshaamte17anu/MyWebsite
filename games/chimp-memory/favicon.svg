<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="chimpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.4" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0D0E15" />
  <rect x="8" y="8" width="84" height="84" rx="18" fill="#161822" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  
  <!-- Neural Grid Symbol -->
  <rect x="22" y="22" width="24" height="24" rx="6" fill="url(#chimpGrad)" filter="url(#glow)" />
  <text x="34" y="39" fill="#090A0F" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" text-anchor="middle">1</text>
  
  <rect x="54" y="22" width="24" height="24" rx="6" fill="#202434" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <text x="66" y="39" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" text-anchor="middle">2</text>
  
  <rect x="22" y="54" width="24" height="24" rx="6" fill="#202434" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <text x="34" y="71" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" text-anchor="middle">3</text>
  
  <rect x="54" y="54" width="24" height="24" rx="6" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1.5" />
  <circle cx="66" cy="66" r="4" fill="#10B981" />
</svg>
