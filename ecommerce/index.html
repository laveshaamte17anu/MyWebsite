<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopX - Premium E-Commerce</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo">
            <h2>ShopX</h2>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search products...">
            <i class="fas fa-search"></i>
        </div>

        <div class="nav-icons">

            <button id="darkModeBtn">
                <i class="fas fa-moon"></i>
            </button>

            <button id="wishlistBtn">
                <i class="fas fa-heart"></i>
            </button>

            <button id="cartBtn">
                <i class="fas fa-shopping-cart"></i>
                <span id="cartCount">0</span>
            </button>

        </div>
    </header>

    <!-- HERO SECTION -->
    <section class="hero">
        <div class="hero-content">
            <h1>Biggest Sale of the Year</h1>
            <p>Up to 70% Off on Premium Products</p>
            <button>Shop Now</button>
        </div>
    </section>

    <!-- CATEGORY FILTER -->
    <section class="categories">

        <button class="category active" data-category="all">
            All
        </button>

        <button class="category" data-category="electronics">
            Electronics
        </button>

        <button class="category" data-category="fashion">
            Fashion
        </button>

        <button class="category" data-category="shoes">
            Shoes
        </button>

        <button class="category" data-category="accessories">
            Accessories
        </button>

    </section>

    <!-- PRODUCTS -->
    <section class="products-section">

        <h2>Featured Products</h2>

        <div class="products-container" id="productsContainer">

            <!-- Products JS मधून येतील -->

        </div>

    </section>

    <!-- CART SIDEBAR -->
    <div class="cart-sidebar" id="cartSidebar">

        <div class="cart-header">
            <h2>Your Cart</h2>
            <button id="closeCart">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div id="cartItems">

        </div>

        <div class="cart-footer">
            <h3>
                Total:
                ₹<span id="cartTotal">0</span>
            </h3>

            <button class="checkout-btn">
                Checkout
            </button>
        </div>

    </div>

    <!-- OVERLAY -->
    <div class="overlay" id="overlay"></div>

    <!-- TOAST -->
    <div class="toast" id="toast">
        Product Added To Cart
    </div>

    <!-- FOOTER -->
    <footer>

        <div class="footer-content">

            <div>
                <h3>ShopX</h3>
                <p>
                    Premium E-Commerce Experience
                </p>
            </div>

            <div>
                <h4>Quick Links</h4>
                <ul>
                    <li>Home</li>
                    <li>Products</li>
                    <li>Cart</li>
                    <li>Contact</li>
                </ul>
            </div>

            <div>
                <h4>Follow Us</h4>

                <div class="social-icons">

                    <i class="fab fa-facebook"></i>
                    <i class="fab fa-instagram"></i>
                    <i class="fab fa-twitter"></i>

                </div>
            </div>

        </div>

    </footer>

    <script src="products.js"></script>
    <script src="script.js"></script>

</body>
</html>
